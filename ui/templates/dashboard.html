<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mind Palace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0e0e0e;
      --surface:   #161616;
      --border:    #2a2a2a;
      --muted:     #555;
      --text:      #d4d4d4;
      --bright:    #f0f0f0;
      --accent:    #e8ff5a;   /* sharp yellow-green — the one pop of color */
      --danger:    #ff5f5f;
      --warn:      #ffaa44;
      --mono:      'IBM Plex Mono', monospace;
      --sans:      'IBM Plex Sans', sans-serif;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      font-size: 13px;
      line-height: 1.5;
    }

    /* ── Layout ── */
    #app {
      display: grid;
      grid-template-rows: auto 1fr;
      height: 100vh;
    }

    header {
      display: flex;
      align-items: baseline;
      gap: 1.5rem;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
    }

    header h1 {
      font-size: 14px;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    #clock {
      font-size: 12px;
      color: var(--muted);
    }

    #status-bar {
      margin-left: auto;
      display: flex;
      gap: 1rem;
      font-size: 11px;
      color: var(--muted);
    }

    .status-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--muted);
      margin-right: 5px;
      vertical-align: middle;
    }
    .status-dot.ok   { background: var(--accent); }
    .status-dot.err  { background: var(--danger); }

    /* ── Main content area ── */
    #content {
      overflow-y: auto;
      padding: 1.5rem;

      /* widget grid — scalable: add more widgets, they reflow */
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      grid-auto-rows: max-content;
      gap: 1px;         /* gap becomes visible border between cells */
      background: var(--border);
      align-content: start;
    }

    /* ── Widget shell ── */
    .widget {
      background: var(--surface);
      padding: 1.25rem 1.25rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      animation: fadeIn 0.25s ease both;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .widget-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
    }

    .widget-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .widget-count {
      font-size: 11px;
      color: var(--muted);
    }

    .widget-count.has-items { color: var(--accent); }

    /* ── Task list ── */
    .task-list {
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .task-item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.5rem;
      align-items: start;
      padding: 0.5rem 0;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.1s;
    }

    .task-item:last-child { border-bottom: none; }

    .task-item:hover { background: rgba(255,255,255,0.03); margin: 0 -1.25rem; padding-left: 1.25rem; padding-right: 1.25rem; }

    .task-title {
      font-family: var(--sans);
      font-size: 13px;
      color: var(--bright);
      line-height: 1.4;
    }

    .task-title.overdue { color: var(--danger); }

    .task-meta {
      font-size: 10px;
      color: var(--muted);
      white-space: nowrap;
      padding-top: 2px;
      text-align: right;
    }

    .task-meta.overdue { color: var(--danger); }
    .task-meta.due-today { color: var(--warn); }

    .task-notes {
      grid-column: 1 / -1;
      font-size: 11px;
      color: var(--muted);
      font-family: var(--sans);
      margin-top: -0.25rem;
    }

    .empty-state {
      font-size: 12px;
      color: var(--muted);
      padding: 0.5rem 0;
    }

    .loading {
      font-size: 12px;
      color: var(--muted);
      animation: pulse 1.2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50%       { opacity: 1; }
    }

    .error-state {
      font-size: 12px;
      color: var(--danger);
    }
  </style>
</head>
<body>
<div id="app">
  <header>
    <h1>Mind Palace</h1>
    <span id="clock"></span>
    <div id="status-bar">
      <span id="vikunja-status">
        <span class="status-dot" id="vikunja-dot"></span>vikunja
      </span>
    </div>
  </header>

  <div id="content">
    <!-- Widgets are injected here by the registry -->
  </div>
</div>

<script>
// ─────────────────────────────────────────────
// Widget Registry
// To add a new widget: push an object to WIDGETS.
// It will be automatically rendered in order.
// ─────────────────────────────────────────────
const WIDGETS = [];

function registerWidget(widget) {
  WIDGETS.push(widget);
}

// ─────────────────────────────────────────────
// Utility helpers
// ─────────────────────────────────────────────
function startOfDay(d) {
  const r = new Date(d); r.setHours(0,0,0,0); return r;
}
function endOfDay(d) {
  const r = new Date(d); r.setHours(23,59,59,999); return r;
}
function endOfWeek(d) {
  const r = new Date(d);
  r.setDate(r.getDate() + (6 - r.getDay())); // Sunday end
  r.setHours(23,59,59,999);
  return r;
}
function parseDate(s) {
  return s ? new Date(s) : null;
}
function fmtDate(d) {
  if (!d) return '';
  const now = new Date();
  const sod = startOfDay(now);
  const eod = endOfDay(now);
  const diff = d - now;
  const absDays = Math.round(Math.abs(diff) / 86400000);

  if (d < sod)        return `${absDays}d overdue`;
  if (d <= eod)       return 'today';
  if (absDays === 1)  return 'tomorrow';
  if (absDays < 7)    return `${absDays}d`;
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

// ─────────────────────────────────────────────
// Data layer — one fetch, shared across widgets
// ─────────────────────────────────────────────
let _tasksCache = null;

async function fetchTasks() {
  if (_tasksCache) return _tasksCache;
  const res = await fetch('/todos/vikunja');
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  _tasksCache = await res.json();
  // reset cache after 60s so periodic refresh works
  setTimeout(() => { _tasksCache = null; }, 60000);
  return _tasksCache;
}

// ─────────────────────────────────────────────
// Widget: Task columns (today, this week, later)
// ─────────────────────────────────────────────
registerWidget({
  id: 'tasks-today',
  title: 'Today & Overdue',
  colspan: 1,
  async data() {
    const tasks = await fetchTasks();
    const now = new Date();
    return tasks.filter(t => {
      if (!t.due_date) return false;
      const d = parseDate(t.due_date);
      return d <= endOfDay(now);
    });
  },
  render(tasks) {
    if (!tasks.length) return '<span class="empty-state">nothing due</span>';
    return tasks.map(t => {
      const d = parseDate(t.due_date);
      const overdue = d && d < startOfDay(new Date());
      return `
        <div class="task-item">
          <span class="task-title ${overdue ? 'overdue' : ''}">${esc(t.title)}</span>
          <span class="task-meta ${overdue ? 'overdue' : 'due-today'}">${fmtDate(d)}</span>
          ${t.description ? `<span class="task-notes">${esc(t.description)}</span>` : ''}
        </div>`;
    }).join('');
  }
});

registerWidget({
  id: 'tasks-week',
  title: 'This Week',
  colspan: 1,
  async data() {
    const tasks = await fetchTasks();
    const now = new Date();
    const eow = endOfWeek(now);
    return tasks.filter(t => {
      if (!t.due_date) return false;
      const d = parseDate(t.due_date);
      return d > endOfDay(now) && d <= eow;
    });
  },
  render(tasks) {
    if (!tasks.length) return '<span class="empty-state">clear week</span>';
    return tasks.map(t => {
      const d = parseDate(t.due_date);
      return `
        <div class="task-item">
          <span class="task-title">${esc(t.title)}</span>
          <span class="task-meta">${fmtDate(d)}</span>
          ${t.description ? `<span class="task-notes">${esc(t.description)}</span>` : ''}
        </div>`;
    }).join('');
  }
});

registerWidget({
  id: 'tasks-later',
  title: 'Upcoming',
  colspan: 1,
  async data() {
    const tasks = await fetchTasks();
    const now = new Date();
    const eow = endOfWeek(now);
    return tasks.filter(t => {
      const d = t.due_date ? parseDate(t.due_date) : null;
      // No due date OR due after this week
      return !d || d > eow;
    });
  },
  render(tasks) {
    if (!tasks.length) return '<span class="empty-state">nothing scheduled</span>';
    return tasks.map(t => {
      const d = parseDate(t.due_date);
      return `
        <div class="task-item">
          <span class="task-title">${esc(t.title)}</span>
          <span class="task-meta">${d ? fmtDate(d) : '—'}</span>
          ${t.description ? `<span class="task-notes">${esc(t.description)}</span>` : ''}
        </div>`;
    }).join('');
  }
});

// ─────────────────────────────────────────────
// Future widgets register here, e.g.:
//
// registerWidget({ id: 'groceries', title: 'Groceries', ... })
// registerWidget({ id: 'weather',   title: 'Weather',   ... })
// ─────────────────────────────────────────────

// ─────────────────────────────────────────────
// Renderer
// ─────────────────────────────────────────────
function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function renderWidget(widget, container) {
  const el = document.createElement('div');
  el.className = 'widget';
  el.id = `widget-${widget.id}`;
  el.innerHTML = `
    <div class="widget-header">
      <span class="widget-title">${widget.title}</span>
      <span class="widget-count" id="count-${widget.id}">—</span>
    </div>
    <div class="task-list" id="list-${widget.id}">
      <span class="loading">loading…</span>
    </div>`;
  container.appendChild(el);

  try {
    const data = await widget.data();
    const countEl = document.getElementById(`count-${widget.id}`);
    const listEl  = document.getElementById(`list-${widget.id}`);
    countEl.textContent = data.length;
    countEl.className = `widget-count ${data.length > 0 ? 'has-items' : ''}`;
    listEl.innerHTML = widget.render(data);
  } catch (e) {
    document.getElementById(`list-${widget.id}`).innerHTML =
      `<span class="error-state">error: ${esc(e.message)}</span>`;
  }
}

async function renderAll() {
  const content = document.getElementById('content');
  content.innerHTML = '';
  _tasksCache = null; // force fresh fetch on manual refresh

  // Update Vikunja status indicator
  try {
    await fetchTasks();
    document.getElementById('vikunja-dot').className = 'status-dot ok';
  } catch {
    document.getElementById('vikunja-dot').className = 'status-dot err';
  }

  for (const widget of WIDGETS) {
    renderWidget(widget, content); // intentionally not awaited — parallel render
  }
}

// ─────────────────────────────────────────────
// Clock
// ─────────────────────────────────────────────
function updateClock() {
  document.getElementById('clock').textContent =
    new Date().toLocaleString('en-US', {
      weekday: 'short', month: 'short', day: 'numeric',
      hour: '2-digit', minute: '2-digit'
    });
}
setInterval(updateClock, 1000);
updateClock();

// Auto-refresh every 5 minutes
setInterval(renderAll, 5 * 60 * 1000);

// Initial render
renderAll();
</script>
</body>
</html>
