version: '3.3'
services:
  mind-palace:
    build: .
    ports:
      - "80:8000"
    volumes:
      - ./mind-palace.db:/app/mind-palace.db
      - ~/.garth:/root/.garth
      - ./data:/app/data
      - ./.env:/app/.env:ro
      - ./main.py:/app/main.py
      - ./api:/app/api
      - ./core:/app/core
      - ./models:/app/models
      - ./services:/app/services
      - ./integrations:/app/integrations
      - ./ui:/app/ui
    environment:
      - DATABASE_URL=sqlite:///./mind-palace.db
      - TZ=America/New_York
    restart: unless-stopped
