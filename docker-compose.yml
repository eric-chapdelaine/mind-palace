version: '3.3'
services:
  mind-palace:
    build: .
    ports:
      - "80:8000"
    volumes:
      - db-data:/app/db
      - ~/.garth:/root/.garth
      - ./data:/app/data
      - ./.env:/app/.env:ro
      - ./main.py:/app/main.py
      - ./api:/app/api
      - ./core:/app/core
      - ./models:/app/models
      - ./schemas:/app/schemas
      - ./services:/app/services
      - ./integrations:/app/integrations
      - ./ui:/app/ui
    environment:
      - DATABASE_URL=sqlite:///./db/mind-palace.db
      - TZ=America/New_York
    restart: unless-stopped

volumes:
  db-data:
